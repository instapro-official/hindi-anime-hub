<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HINDI ANIME HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navbar -->
    <header class="navbar">
        <div class="nav-left">
            <i class="fa-solid fa-bars menu-icon"></i>
            <div class="logo">
                <i class="fa-solid fa-play"></i> HINDI ANIME HUB
            </div>
        </div>
        <div class="nav-right">
            <button id="adminLoginBtn" class="btn-toggle"><i class="fa-solid fa-lock"></i> Admin Panel</button>
        </div>
    </header>

    <!-- Secure Admin Panel -->
    <section id="adminSection" class="admin-panel hidden">
        <div class="admin-header">
            <h3><i class="fa-solid fa-user-shield"></i> Boss Admin Control</h3>
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>
        
        <form id="animeForm">
            <input type="text" id="animeTitle" placeholder="Anime Name (e.g. Demon Slayer)" required>
            <input type="text" id="animeImg" placeholder="Poster Image URL" required>
            <input type="text" id="animeEp" placeholder="Episode Tag (e.g. Ep 55 Hindi)" required>
            <input type="text" id="telegramLink" placeholder="Stream/Embed Video Link" required>
            <select id="animeType">
                <option value="TV">TV</option>
                <option value="MOVIE">MOVIE</option>
            </select>
            <select id="category">
                <option value="popular">Popular Today</option>
                <option value="latest">Latest Release</option>
            </select>
            <button type="submit" class="btn-submit">Publish Anime</button>
        </form>
    </section>

    <!-- Popular Today Section -->
    <section class="section-container">
        <h2 class="section-title">Popular Today</h2>
        <div class="horizontal-scroll" id="popularContainer"></div>
    </section>

    <!-- Latest Release Section -->
    <section class="section-container">
        <div class="section-header">
            <h2 class="section-title">Latest Release</h2>
            <a href="#" class="view-all">VIEW ALL</a>
        </div>
        <div class="grid-container" id="latestContainer"></div>
    </section>

    <!-- Crunchyroll Style Video Player Modal -->
    <div id="videoModal" class="video-modal">
        <div class="video-content">
            <div class="modal-header">
                <h3 id="playerTitle">Anime Player</h3>
                <span class="close-btn" onclick="closePlayer()">&times;</span>
            </div>
            <div class="iframe-container">
                <iframe id="videoPlayer" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
