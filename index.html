<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width">
<title>Admin Panel</title>
<style>body{background:#111;color:#fff;padding:20px;font-family:Arial}
input{width:100%;padding:10px;margin:8px 0;background:#222;color:#fff;border:none;border-radius:8px}
button{background:#ff006a;color:#fff;padding:12px;width:100%;border:none;border-radius:10px;font-weight:700}
#preview img{width:150px;border-radius:10px;margin-top:10px}
</style></head>
<body>
<h2>🔥 Admin - Nayi Anime Add Karo</h2>
<input id="title" placeholder="Anime ka Naam">
<input type="file" id="photo" accept="image/*">
<div id="preview"></div>
<input id="episode" placeholder="EP 1 Hindi">
<input id="video" placeholder="YouTube / Drive Video Link">
<textarea id="output" style="width:100%;height:150px;margin-top:15px;background:#222;color:#0f0;border:none"></textarea>
<button onclick="copyJSON()">Copy Karo</button>

<script>
let finalImage = "";
document.getElementById('photo').addEventListener('change', e=>{
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = ()=>{
    finalImage = reader.result;
    document.getElementById('preview').innerHTML = `<img src="${finalImage}"><p style="color:lightgreen">✅ Gallery Photo Ready!</p>`;
    makeJSON();
  };
  reader.readAsDataURL(file);
});

function makeJSON(){
  const j = {
    title: document.getElementById('title').value || "New Anime",
    image: finalImage,
    episode: document.getElementById('episode').value || "EP 1 Hindi",
    video: document.getElementById('video').value || ""
  };
  document.getElementById('output').value = JSON.stringify(j, null, 2) + ",";
}

document.querySelectorAll('input').forEach(i=> i.addEventListener('input', makeJSON));

function copyJSON(){
  document.getElementById('output').select();
  document.execCommand('copy');
  alert("Copied! Ab animes.json me paste karke Commit karo");
}
</script>
</body></html>
