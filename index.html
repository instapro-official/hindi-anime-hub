<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hindi Anime Hub - Watch Anime in Hindi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0f;color:white}
header{padding:15px;background:#161622;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-size:22px;font-weight:800;color:#ff2e63}
.logo span{color:white}
.search{padding:8px 12px;border-radius:20px;border:none;width:55%;background:#22223a;color:white}
.hero{padding:30px 15px;background:linear-gradient(135deg,#ff2e63,#8a2be2);text-align:center}
.hero h1{font-size:28px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:#161622;border-radius:12px;overflow:hidden}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:10px}
.card-body h3{font-size:14px;margin-bottom:4px}
.tag{font-size:11px;background:#ff2e63;padding:2px 6px;border-radius:10px}
.btn{width:100%;margin-top:8px;padding:7px;border:none;border-radius:8px;background:#6c5ce7;color:white;font-weight:600}
footer{text-align:center;padding:20px;color:#888;font-size:12px}
</style>
</head>
